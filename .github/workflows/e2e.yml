name: End-to-end

# The plugin in a real, throwaway shop for each supported Sylius version:
# signed webhook calls over HTTP (with a channel's own secret), the sync page
# behind the admin login, and a sync run from the admin in a browser against
# a fake Pricee API (see e2e/run.sh).
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    name: Sylius ${{ matrix.sylius }} - webhook and sync
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sylius: ["~2.1.0", "~2.2.0"]

    steps:
      - uses: actions/checkout@v7

      # Installs the dependencies, which e2e/run.sh then serves from its own containers
      - name: Build Sylius Test Application
        uses: SyliusLabs/BuildTestAppAction@v4
        with:
          e2e_js: "no"
          cache_key: "${{ runner.os }}-php-8.3-composer-${{ hashFiles('**/composer.json') }}"
          cache_restore_key: "${{ runner.os }}-php-8.3-composer-"
          database: "mysql:8.4"
          php_version: "8.3"
          sylius_version: "${{ matrix.sylius }}"
          symfony_version: "^7.4"

      # The action skips the frontend without e2e_js: the admin pages need it
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the test application assets
        run: composer frontend-clear

      - name: Run the end-to-end tests
        run: e2e/run.sh

      - name: Upload the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-sylius-${{ matrix.sylius }}
          path: e2e/output/
          if-no-files-found: ignore
